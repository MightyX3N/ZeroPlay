[package]
name = "zeroplay-server"
description = "ZeroPlay server: holds the console stream and passes it on to every player in a browser."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zeroplay-xbox = { path = "../zeroplay-xbox" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.21"
rtc = "0.21"

[dev-dependencies]
bytes = "1"
