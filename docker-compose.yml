# ZeroPlay on a NAS. Paste this into your NAS's container manager (Portainer,
# Synology Container Manager, Unraid, TrueNAS, ...) or run `docker compose up -d`
# next to it. No need to download the source.

services:
  zeroplay:
    image: ghcr.io/mightyx3n/zeroplay:latest
    container_name: zeroplay
    restart: unless-stopped
    # Host networking lets players on the home network reach the video ports
    # directly, and lets the playit agent see the server.
    network_mode: host
    volumes:
      # The Microsoft sign-in is kept here. Change the left side to a folder on your NAS.
      - ./zeroplay-data:/data
    environment:
      # Password for the web page (any user name). Set one before using playit.
      ZEROPLAY_PASSWORD: ""
      # playit.gg secret key (https://playit.gg/account/agents). Empty = home network only.
      PLAYIT_SECRET: ""
      # Address of the web page.
      ZEROPLAY_HTTP: "0.0.0.0:8080"
      # UDP ports for video, one per connected player or watcher.
      ZEROPLAY_RTC_PORTS: "50000-50009"
      # Extra addresses players reach the video ports on, comma separated.
      # For a playit UDP tunnel covering 50000-50009: "your-tunnel.ply.gg:12000"
      ZEROPLAY_ANNOUNCE: ""
