# ZeroPlay on a NAS. Paste this into your NAS's container manager (Portainer,
# Synology Container Manager, Unraid, TrueNAS, ...) or run `docker compose up -d`
# next to it. Everything else is set up on the page at http://<nas-address>:8080.

services:
  zeroplay:
    image: ghcr.io/mightyx3n/zeroplay:latest
    container_name: zeroplay
    restart: unless-stopped
    # Host networking lets players on the home network reach the video ports
    # directly, and lets the playit agent reach the server.
    network_mode: host
    volumes:
      # Microsoft sign-in, password and playit link are kept here.
      # Change the left side to a folder on your NAS.
      - ./zeroplay-data:/data
